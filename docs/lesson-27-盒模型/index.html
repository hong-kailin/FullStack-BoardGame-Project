<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>盒模型</title>
  <style>
    .card {
      background-color: #333;
      color: #eee;
      width: 200px;
      padding: 20px;
      border: 1px solid white;
      margin: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>玩家 1</h2>
    <p>标记: 红x2 蓝x1</p>
    <p>声望: 3 | 王冠: 1</p>
  </div>

  <div class="card">
    <h2>玩家 2</h2>
    <p>标记: 无</p>
    <p>声望: 0 | 王冠: 0</p>
  </div>
</body>
</html>
