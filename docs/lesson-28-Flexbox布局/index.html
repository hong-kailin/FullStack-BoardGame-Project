<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Flexbox 布局</title>
  <style>
    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .box {
      background-color: #333;
      color: #eee;
      padding: 20px;
      border: 1px solid white;
      width: 150px;
    }
  </style>
</head>
<body>
  <h1>玩家信息</h1>

  <div class="container">
    <div class="box">
      <h2>玩家 1</h2>
      <p>标记: 红x2 蓝x1</p>
      <p>声望: 3</p>
    </div>

    <div class="box">
      <h2>玩家 2</h2>
      <p>标记: 无</p>
      <p>声望: 0</p>
    </div>
  </div>
</body>
</html>
